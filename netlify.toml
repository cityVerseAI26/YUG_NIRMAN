[build]
  base = "ai-future-city-simulator"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_DATA_API_URL = "/api/proxy"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/proxy/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
